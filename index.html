<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma interactiva para aprender MATLAB aplicado al Análisis Matricial de Estructuras e Ingeniería Civil.">
  <title>Aprendiendo MATLAB para análisis estructural</title>
  
  <!-- Estilos de la Plataforma -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Contenedor Principal de la App -->
  <div id="app-container">

    <!-- Fondo Oscuro para Menú Móvil -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Menú Lateral (Sidebar) -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand" href="#home">
          <div class="brand-icon">M\K</div>
          <div class="brand-text">
            <h1>MATLAB Estructural</h1>
            <span>Ingeniería Civil</span>
          </div>
        </a>

        <!-- Indicador de Progreso del Estudiante -->
        <div class="sidebar-progress">
          <div class="progress-header">
            <span>Progreso del Curso</span>
            <strong>0%</strong>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- Lista de Enlaces Dinámicos -->
      <nav class="sidebar-nav" id="sidebar-nav-list">
        <!-- Renderizado por app.js -->
      </nav>
    </aside>

    <!-- Área Principal de Contenido -->
    <div id="main-wrapper">
      
      <!-- Barra Superior (Topbar) -->
      <header id="topbar">
        <div class="topbar-left">
          <button id="menu-toggle" class="menu-toggle-btn" aria-label="Abrir menú">
            ☰
          </button>
          <div class="current-breadcrumb" id="breadcrumb-title">
            Inicio &bull; <span>Ruta de Aprendizaje</span>
          </div>
        </div>

        <div class="topbar-right">
          <button id="search-btn" class="search-box-btn" aria-label="Buscar en el curso">
            <span>🔍</span>
            <span>Buscar lección o variable...</span>
            <span class="kbd-shortcut">Ctrl K</span>
          </button>
        </div>
      </header>

      <!-- Área Desplazable de Contenido -->
      <main id="content-scroll-area">
        <div id="content-container">
          <!-- Renderizado dinámicamente por app.js -->
        </div>
      </main>

    </div>
  </div>

  <!-- Modal de Búsqueda Global -->
  <div id="search-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="search-modal">
      <div class="search-modal-header">
        <span style="color: var(--text-muted);">🔍</span>
        <input type="text" id="search-input" class="search-modal-input" placeholder="Buscar por tema, comando MATLAB o variable estructural...">
        <button id="modal-close" class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;">ESC</button>
      </div>
      <div id="search-results" class="search-results-list">
        <!-- Resultados generados en tiempo real -->
      </div>
    </div>
  </div>

  <!-- Scripts del Sistema -->
  <script src="js/content-data.js"></script>
  <script src="js/progress-tracker.js"></script>
  <script src="js/exercise-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
